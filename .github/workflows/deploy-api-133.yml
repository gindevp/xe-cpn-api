name: Deploy API 133

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api-133
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Package
        run: >
          chmod +x mvnw && ./mvnw -B -Pprod package
          -DskipTests
          -Dmaven.test.skip=true
          -Dmodernizer.skip=true
          -Dcheckstyle.skip=true
          -Dspotless.check.skip=true
          -Dskip.npm=true
          -Dskip.installnodenpm=true

      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPN_API_SSH_HOST }}
          username: root
          key: ${{ secrets.CPN_API_SSH_KEY }}
          port: ${{ secrets.CPN_API_SSH_PORT }}
          source: target/cpn-0.0.1-SNAPSHOT.jar
          target: /opt/cpn-api
          strip_components: 1
          overwrite: true

      - name: Recreate cpn-api
        uses: appleboy/ssh-action@v1.2.0
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CPN_DB_PASSWORD }}
          JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${{ secrets.CPN_JWT_SECRET }}
        with:
          host: ${{ secrets.CPN_API_SSH_HOST }}
          username: root
          key: ${{ secrets.CPN_API_SSH_KEY }}
          port: ${{ secrets.CPN_API_SSH_PORT }}
          command_timeout: 20m
          script_stop: false
          envs: SPRING_DATASOURCE_PASSWORD,JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET
          script: |
            set -eu
            mkdir -p /opt/cpn-api
            test -f /opt/cpn-api/cpn-0.0.1-SNAPSHOT.jar
            docker rm -f cpn-api >/dev/null 2>&1 || true
            mv -f /opt/cpn-api/cpn-0.0.1-SNAPSHOT.jar /opt/cpn-api/app.jar
            if [ ! -f /etc/nginx/conf.d/cpn-api.conf ] || grep -q DRONE_SSH /etc/nginx/conf.d/cpn-api.conf; then
              printf '%s\n' \
                'server {' \
                '    listen 80;' \
                '    server_name api.cpn.xevietnam.com;' \
                '    location / {' \
                '        proxy_pass http://127.0.0.1:7080;' \
                '        proxy_set_header Host $host;' \
                '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
                '        proxy_set_header X-Forwarded-Proto $scheme;' \
                '    }' \
                '}' > /etc/nginx/conf.d/cpn-api.conf
              nginx -t
              systemctl reload nginx
            fi
            docker run -d --name cpn-api --restart unless-stopped \
              --memory 1536m --memory-swap 1536m \
              -p 127.0.0.1:7080:8080 \
              -e PORT=8080 \
              -e SPRING_PROFILES_ACTIVE=prod,demo \
              -e SPRING_DATASOURCE_URL='jdbc:mysql://192.168.26.83:3308/cpn?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh' \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD \
              -e JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET \
              -e JHIPSTER_CORS_ALLOWED_ORIGINS=https://cpn.xevietnam.com \
              -e JHIPSTER_MAIL_BASE_URL=https://api.cpn.xevietnam.com \
              -v /opt/cpn-api/app.jar:/app/app.jar:ro \
              eclipse-temurin:17-jre-jammy \
              sh -c 'java -Xms256m -Xmx1024m -Xss512k -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1PeriodicGCInterval=60000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:+UseStringDeduplication -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -jar /app/app.jar'
            ok=0
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:7080/management/health; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              docker logs --tail 120 cpn-api
              exit 1
            fi
